name: "Close Stale Issues"

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. 
            It will be closed in 14 days if no further activity occurs. Thank you for your contributions.
          close-issue-message: |
            This issue was automatically closed because it has been stale for 14 days with no activity.
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,bug,enhancement"
          
          # Pull Requests
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs. Thank you for your contributions.
          close-pr-message: |
            This pull request was automatically closed because it has been stale for 14 days with no activity.
          days-before-pr-stale: 90
          days-before-pr-close: 14
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,security"
          
          # Configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          exempt-all-assignees: false
          exempt-draft-pr: true
          enable-statistics: true
