# Dependabot configuration for automated dependency updates
# This helps keep dependencies secure and up-to-date
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "triple-labs/security-team"  # Update with actual team
    assignees:
      - "triple-labs/security-team"  # Update with actual team

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Java/Maven dependencies (for Android examples)
  - package-ecosystem: "gradle"
    directory: "/example/android/test"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"

# Configuration notes:
# - Dependabot will automatically check for security updates
# - Security updates are prioritized and created immediately
# - Version updates follow the schedule defined above
# - PRs are auto-labeled for easy filtering and review
# - Configure appropriate reviewers and assignees for your team
